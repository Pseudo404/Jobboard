<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cvl: {
                dark: "#29235C",
                blue: "#009FE3",
                yellow: "#F5CE2E",
                green: "#13A538",
                light: "#90D4F6",
                pale: "#E6F5FC",
              },
            },
          },
        },
      };
    </script>
    <title>Accès Recruteur - Publier une offre</title>
  </head>
  <body class="min-h-screen bg-cvl-pale font-sans text-cvl-dark antialiased">
    <header
      class="sticky top-0 z-50 border-b border-cvl-blue/10 bg-white/90 backdrop-blur-md shadow-sm"
    >
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8"
      >
        <ul class="flex items-center gap-3 sm:gap-6">
          <li class="p-2">
            <a
              href="index.html"
              class="text-sm font-medium text-gray-600 hover:text-cvl-blue transition"
              >Accueil</a
            >
          </li>
          <li class="p-2">
            <a
              href="jobs.html"
              class="text-sm font-medium text-gray-600 hover:text-cvl-blue transition"
              >Toutes les offres</a
            >
          </li>
          <li class="p-2">
            <a
              href="apropos.html"
              class="text-sm font-medium text-gray-600 hover:text-cvl-blue transition"
              >Méthodologie</a
            >
          </li>
          <li class="p-2">
            <a
              href="recruteur.html"
              class="text-sm font-bold text-cvl-blue transition"
              >Accès recruteur</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="mx-auto max-w-3xl px-6 py-12">
      <div class="mb-8">
        <h1 class="text-3xl font-extrabold text-cvl-dark mb-2">
          Publier une opportunité
        </h1>
        <p class="text-gray-600">
          Attirez les jeunes talents en Centre-Val de Loire en détaillant votre
          offre et les perspectives d'évolution.
        </p>
      </div>

      <form
        id="job-form"
        class="space-y-6 bg-white p-8 rounded-2xl border border-cvl-blue/10 shadow-md"
      >
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Titre du poste *</label
            >
            <input
              type="text"
              id="titre"
              required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Entreprise *</label
            >
            <input
              type="text"
              id="entreprise"
              required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Secteur *</label
            >
            <input
              type="text"
              id="secteur"
              placeholder="Ex: Informatique..."
              required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Lieu *</label
            >
            <input
              type="text"
              id="lieu"
              placeholder="Ex: Orléans (45)"
              required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Contrat *</label
            >
            <select
              id="contrat"
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            >
              <option value="CDI">CDI</option>
              <option value="CDD">CDD</option>
              <option value="Alternance">Alternance</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Salaire (Brut Annuel) *</label
            >
            <input
              type="text"
              id="salaire"
              placeholder="Ex: 32 000 - 38 000"
              required
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Télétravail</label
            >
            <select
              id="teletravail"
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            >
              <option value="Hybride">Hybride</option>
              <option value="Sur site">Sur site</option>
              <option value="100% Télétravail">100% Télétravail</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-bold text-cvl-dark mb-2"
              >Expérience</label
            >
            <input
              type="text"
              id="experience"
              placeholder="Ex: Débutant"
              class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
            />
          </div>
        </div>

        <div>
          <label class="block text-sm font-bold text-cvl-dark mb-2"
            >Description du poste *</label
          >
          <textarea
            id="description"
            rows="3"
            required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
          ></textarea>
        </div>

        <div>
          <label class="block text-sm font-bold text-cvl-dark mb-2"
            >Évolution possible (2 à 5 ans) *</label
          >
          <textarea
            id="evolution"
            rows="2"
            placeholder="Ex: Devenir Chef de projet..."
            required
            class="w-full rounded-xl border border-gray-300 bg-white px-4 py-3 text-cvl-dark focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition"
          ></textarea>
        </div>

        <div
          id="success-msg"
          class="hidden rounded-lg bg-cvl-green/10 p-4 text-cvl-green font-bold border border-cvl-green/30"
        >
          Offre publiée avec succès ! Redirection en cours...
        </div>

        <button
          type="submit"
          class="w-full rounded-xl bg-cvl-blue px-8 py-4 text-lg font-bold text-white shadow-md hover:bg-cvl-dark transition"
        >
          Publier l'offre
        </button>
      </form>
    </main>
    <hr class="border-t-1 border-cvl-blue border-opacity-25" />
    <footer class="bg-cvl-pale py-8 text-center text-cvl-blue text-sm w-full">
      <p>Hackathon Hussar Academy - Centralis</p>
    </footer>
    <script type="module" src="./recruteur.js"></script>
  </body>
</html>
