<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              cvl: {
                dark: "#29235C",
                blue: "#009FE3",
                yellow: "#F5CE2E",
                green: "#13A538",
                light: "#90D4F6",
                pale: "#E6F5FC",
              },
            },
          },
        },
      };
    </script>
    <title>Toutes les offres - Centralis</title>
  </head>
  <body class="min-h-screen bg-cvl-pale font-sans text-cvl-dark antialiased">
    <header
      class="sticky top-0 z-50 border-b border-cvl-blue/10 bg-white/90 backdrop-blur-md shadow-sm"
    >
      <nav
        class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4 lg:px-8"
      >
        <ul class="flex items-center gap-3 sm:gap-6">
          <li class="p-2">
            <a
              href="index.html"
              class="text-sm font-medium text-gray-600 transition hover:text-cvl-blue sm:text-base"
              >Accueil</a
            >
          </li>
          <li class="p-2">
            <a
              href="jobs.html"
              class="text-sm font-bold text-cvl-blue transition sm:text-base"
              >Toutes les offres</a
            >
          </li>
          <li class="p-2">
            <a
              href="apropos.html"
              class="text-sm font-medium text-gray-600 hover:text-cvl-blue transition"
              >Méthodologie</a
            >
          </li>
          <li class="p-2">
            <a
              href="recruteur.html"
              class="text-sm font-medium text-gray-600 transition hover:text-cvl-blue sm:text-base"
              >Accès recruteur</a
            >
          </li>
        </ul>
        <ol class="flex items-center gap-2 sm:gap-4">
          <li>
            <a
              href="#"
              class="inline-flex items-center rounded-xl border border-cvl-blue/20 bg-white px-3 py-2 text-sm font-bold text-cvl-dark shadow-sm transition hover:bg-cvl-pale sm:px-4"
              >Se connecter</a
            >
          </li>
          <li>
            <a
              href="recruteur.html"
              class="inline-flex items-center rounded-xl bg-cvl-blue px-3 py-2 text-sm font-bold text-white shadow-sm transition hover:bg-cvl-dark sm:px-5"
              >S'inscrire / Recruter</a
            >
          </li>
        </ol>
      </nav>
    </header>

    <main class="mx-auto min-h-[70vh] max-w-7xl px-6 py-12 lg:px-8">
      <div
        class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4"
      >
        <div>
          <h1 class="text-3xl font-extrabold text-cvl-dark mb-2">
            Opportunités en Centre-Val de Loire
          </h1>
          <p class="text-gray-600">
            Trouvez le poste idéal et comparez votre futur cadre de vie.
          </p>
        </div>
      </div>

      <div class="mb-10 max-w-2xl">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 flex items-center pl-4 pointer-events-none"
          >
            <svg
              class="w-5 h-5 text-cvl-blue"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"
              ></path>
            </svg>
          </div>
          <input
            type="search"
            id="search-input"
            class="w-full rounded-xl border border-cvl-blue/20 bg-white p-4 pl-12 text-cvl-dark font-medium focus:border-cvl-blue focus:outline-none focus:ring-2 focus:ring-cvl-blue transition shadow-sm"
            placeholder="Rechercher par métier, entreprise, ville ou secteur..."
          />
        </div>
      </div>

      <div
        id="all-jobs-container"
        class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"
      ></div>
    </main>

    <hr class="border-t-1 border-cvl-blue border-opacity-25" />
    <footer class="bg-cvl-pale py-8 text-center text-cvl-blue text-sm w-full">
      <p>Hackathon Hussar Academy - Centralis</p>
    </footer>
    <script type="module" src="./jobs.js"></script>
  </body>
</html>
